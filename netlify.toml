# Árbol Pérez Quintanar — publicación en Netlify (sin cuentas).
# El árbol compartido se guarda en Netlify Blobs. Cada navegador también
# guarda una copia local para que añadir personas no falle si la API tarda.

[build]
  command = "npm run build:netlify"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"
  VITE_AUTH_ENABLED = "false"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions.tree]
  external_node_modules = ["@netlify/blobs"]

[[redirects]]
  from = "/api/tree"
  to = "/.netlify/functions/tree"
  status = 200
  force = true
